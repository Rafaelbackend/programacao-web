<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Coyote Lanches</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <figure>
            <img src="coyote.jpeg" alt="">
            <h1>Bem vindo ao Coyote</h1>
            <p>Aqui você encontra as melhores opções de lanches, preparados com os melhores ingredientes e feitos com muito amor e carinho, entregues até você no conforto de sua casa.</p>
        </figure>
        <main>
            <div>
                <h1>🐺 Coyote Lanches</h1>

                <h2>🍔 Hambúrgueres</h2>
                <div id="hamburgueres"></div>

                <h2>🌭 Hot Dogs</h2>
                <div id="hotdogs"></div>

                <h2>🥤 Bebidas</h2>
                <div id="bebidas"></div>

                <h2>➕ Adicionais</h2>
                <div id="adicionais"></div>

                <h2>📍 Endereço</h2>
                <input type="text" id="endereco" placeholder="Digite seu endereço completo">

                <h2>💰 Total: R$ <span id="total">0.00</span></h2>

                <button onclick="enviarPedido()">📲 Enviar Pedido no WhatsApp</button>

                <script src="script.js"></script>
            </div>
        </main>
    </header>
</body>
</html>
